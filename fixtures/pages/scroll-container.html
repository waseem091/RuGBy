<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{font:18px/1.5 sans-serif;background:#fff;color:#111827}section{padding:16px}p,h1,h2{margin:0 0 8px}</style><title>Scroll container</title>
<style>.scroller{height:120px;overflow:auto;background:#f9fafb;margin:16px;padding:8px 12px;border:1px solid #e5e7eb}.scroller p{height:44px;margin:0}</style></head><body>
<div class="scroller"><p id="row-1" style="color:#4b5563">Visible row one, gray 600.</p><p id="row-2" style="color:#9ca3af">Visible row two, gray 400.</p>
<p id="row-3">Row three is partly visible.</p><p id="row-4">Row four is scrolled out of view.</p><p id="row-5">Row five is scrolled out of view.</p><p id="row-6">Row six is scrolled out of view.</p></div>
</body></html>

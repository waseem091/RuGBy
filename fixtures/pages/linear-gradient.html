<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{font:18px/1.5 sans-serif;background:#fff;color:#111827}section{padding:16px}p,h1,h2{margin:0 0 8px}</style><title>Text on a linear gradient</title>
<style>.hero{background:linear-gradient(90deg,#93c5fd 0 120px,#1e3a8a 600px)}.soft{background:linear-gradient(90deg,#bfdbfe 0 120px,#ffffff 420px)}</style></head><body>
<section class="hero"><h2 id="cta" style="color:#fff;font-size:18px;font-weight:400">Start your free trial today, no credit card required</h2></section>
<section class="soft"><p id="soft">Dark text over a pale gradient stays readable everywhere.</p></section>
</body></html>

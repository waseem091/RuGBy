<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{font:18px/1.5 sans-serif;background:#fff;color:#111827}section{padding:16px}p,h1,h2{margin:0 0 8px}</style><title>mix-blend-mode difference</title>
<style>.mid{background:#808080}.light{background:#e5e7eb}.blend{color:#fff;mix-blend-mode:difference}</style></head><body>
<section class="mid"><p id="blend-fail" class="blend">Difference-blended white text on mid gray nearly vanishes.</p></section>
<section class="light"><p id="blend-pass" class="blend">The same text on light gray turns almost black.</p></section>
</body></html>

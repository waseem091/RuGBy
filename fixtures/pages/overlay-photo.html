<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{font:18px/1.5 sans-serif;background:#fff;color:#111827}section{padding:16px}p,h1,h2{margin:0 0 8px}</style><title>Overlay over a photo</title>
<style>.card{position:relative;height:400px;overflow:hidden}.card img{position:absolute;left:0;top:0;width:800px;height:400px}.card .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}.card .copy{position:relative;padding:40px 16px}</style></head><body>
<section class="card" style="padding:0"><img src="photo-white.png" alt=""><div class="scrim"></div>
<div class="copy"><p id="overlay-text" style="color:#fff">White text on a 40% black scrim over a bright photo.</p></div></section>
</body></html>

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - name: End-to-end audit of the fixture pages (must finish in under 60 s)
        run: |
          start=$(date +%s)
          node dist/cli.js audit fixtures/pages --max-pages 50 --tokens none --dark-class dark --fail-on none --json > rugby-fixtures.json
          elapsed=$(( $(date +%s) - start ))
          echo "fixture audit took ${elapsed}s"
          test "$elapsed" -lt 60
      - name: Exhaustive color test over all 16,777,216 colors
        run: pnpm exec vitest run test/color/exhaustive.test.ts
        env:
          RUGBY_EXHAUSTIVE: "1"

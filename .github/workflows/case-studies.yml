name: Case studies

# Audits a handful of well-known public sites, read-only, at most one page every
# 2 seconds per host (RuGBy's built-in rate limit), and commits a compact digest
# (docs/case-studies/) back to the branch. Runs when the site list changes, or by hand.
on:
  push:
    paths:
      - case-studies/sites.json
      - scripts/case-study-digest.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: case-studies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Audit each site (home page + one content page, 375/1440, light/dark)
        env:
          RUGBY_DEBUG: "1"
        run: |
          set +e
          mkdir -p case-studies/out
          for id in $(node -e 'for (const s of require("./case-studies/sites.json")) console.log(s.id)'); do
            urls=$(node -e 'const s=require("./case-studies/sites.json").find((x)=>x.id===process.argv[1]); console.log(s.urls.join(" "))' "$id")
            echo "::group::$id"
            mkdir -p "case-studies/out/$id"
            start=$(date +%s)
            ( cd "case-studies/out/$id" && timeout 1200 node ../../../dist/cli.js audit $urls --fail-on none --html index.html --concurrency 2 > terminal.txt 2> stderr.txt )
            code=$?
            echo "exit $code after $(( $(date +%s) - start ))s"
            head -n 3 "case-studies/out/$id/terminal.txt"
            grep -E "^\[rugby\].*(drift|batches\+sampling|axe) " "case-studies/out/$id/stderr.txt" | tail -n 16
            if [ "$code" != "0" ]; then grep -v "^\[rugby\]" "case-studies/out/$id/stderr.txt" | tail -n 40; fi
            echo "::endgroup::"
          done
          exit 0
      - name: Digest
        run: node scripts/case-study-digest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-studies-full
          path: case-studies/out/
      - name: Commit the digest to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/case-studies
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "case studies: real-world audit digest from CI"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
